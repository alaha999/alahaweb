# ── RESEARCH ───────────────────────────────────────────────────
research:
  - tag: "BSM Search"
    title: "Search for Beyond Standard Model Signatures"
    body: |
      Searches for BSM phenomena in multilepton final states, model-independently
      and/or targeting specific models: Vector-like leptons, seesaw mechanisms, and
      leptoquarks. Machine learning to enhance search sensitivity. Currently working
      on searches exploring Dark Sector models in the ATLAS experiment. Designing
      a cut-based strategy for emerging jets search using Full Run 3 ATLAS dataset.
    keywords: "BSM multilepton VLLs seesaw leptoquark ML Dark Sector"

  - tag: "CMS Simulation · HL-LHC"
    title: "Phase 2 Tracking in CMS Fast Simulation"
    body: |
      Implementation of the Phase 2 tracker geometry and tracking in the CMS
      Fast Simulation package for the HL-LHC upgrade, enabling faster Monte Carlo
      event generation for HL-LHC physics studies.
    keywords: "phase 2 tracker CMS fast simulation HL-LHC Monte Carlo"
    
  - tag: "ATLAS Simulation · HL-LHC"
    title: "Fast Calorimetry for Long Lived Particles"
    body: |      
      Working on ATLAS Fast Calorimeter simulation software (AF3) to implement
      fast reconstruction of long-lived particles in the ATLAS calorimeter.
    keywords: "HL-LHC ATLAS Fast Calorimetry MC Simulation LLP"

  - tag: "Machine Learning"
    title: "Latent Space Representation of HEP Data"
    body: |
      Investigating hidden patterns in multidimensional HEP data using PCA, UMAP,
      and Autoencoders for lepton classification on CERN Open Data. Also uses GANs
      to speed up W+jets and Z+jets event simulation at LHC.
    keywords: "PCA UMAP autoencoder GAN latent space lepton classification"

  - tag: "CMS Service Work"
    title: "B-Tagging Contact, CMS EXOTICA Group"
    body: |
      Reviewing heavy flavor tagging usage in CMS EXOTICA analyses and supporting
      analyzers with b-tagging tool implementation in liaison with the CMS b-tagging
      object group. Over 40 analyses reviewed.
    keywords: "b-tagging EXOTICA heavy flavor CMS service"

